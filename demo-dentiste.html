<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Démo assistant dentaire</title><style>*{box-sizing:border-box;margin:0}body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#10303c;background:#f4f9fb;min-height:100vh}header{background:#fff;padding:16px 24px;font-weight:700;color:#0a7ea4;border-bottom:1px solid #dbe9ef}.hero{background:#0a7ea4;color:#fff;text-align:center;padding:72px 20px}.hero h1{font-size:clamp(26px,5vw,44px);line-height:1.15;max-width:18ch;margin:0 auto 14px}.hero p{max-width:52ch;margin:0 auto;opacity:.92}#fab{position:fixed;right:20px;bottom:20px;width:62px;height:62px;border-radius:50%;border:0;background:#0a7ea4;color:#fff;font-size:26px;cursor:pointer;box-shadow:0 4px 14px #0003}#box{position:fixed;right:20px;bottom:96px;width:min(380px,calc(100vw - 40px));height:min(560px,calc(100vh - 120px));background:#fff;border-radius:14px;box-shadow:0 8px 30px #0003;display:none;flex-direction:column;overflow:hidden}#box.on{display:flex}#top{background:#0a7ea4;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;font-weight:600}#top button{background:none;border:0;color:#fff;font-size:20px;cursor:pointer}#log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px;background:#f4f9fb}.m{max-width:85%;padding:10px 12px;border-radius:12px;font-size:14.5px;line-height:1.4;white-space:pre-line;word-wrap:break-word}.b{background:#fff;border:1px solid #dbe9ef;align-self:flex-start}.u{background:#0a7ea4;color:#fff;align-self:flex-end}.card{background:#fff8e6;border:1px dashed #d9a400;font-size:13px}.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{border:1px solid #0a7ea4;background:#fff;color:#0a7ea4;border-radius:16px;padding:6px 12px;font-size:13.5px;cursor:pointer}.chips button:hover{background:#0a7ea4;color:#fff}.wa{display:inline-block;background:#1faa59;color:#fff;text-decoration:none;border-radius:16px;padding:7px 14px;font-size:14px;align-self:flex-start}form{display:flex;gap:8px;padding:10px;border-top:1px solid #dbe9ef}input{flex:1;border:1px solid #c5d8e0;border-radius:20px;padding:10px 14px;font-size:15px}form button{border:0;background:#0a7ea4;color:#fff;border-radius:20px;padding:0 16px;cursor:pointer;font-size:15px}</style></head><body><header id="brand"></header><section class="hero"><h1 id="h1"></h1><p id="sub"></p></section><button id="fab">💬</button><div id="box"><div id="top"><span id="ttl"></span><button id="x">✕</button></div><div id="log"></div><form id="f"><input id="in" autocomplete="off"><button>➤</button></form></div><script>
const q=new URLSearchParams(location.search);
let lang=(q.get('lang')||'fr').slice(0,2).toLowerCase();if(!['fr','en'].includes(lang))lang='fr';
const C={clinic:q.get('clinic')||'Clinique Sourire+ Cocody',city:q.get('city')||'Abidjan',wa:(q.get('wa')||'2250705834850').replace(/\D/g,''),notify:q.get('notify')||''};
const T={
fr:{brand:'🦷 ',h1:n=>'Assistant IA de '+n,sub:'Démo : votre assistant répond aux patients et prend les RDV 24h/24. Cliquez sur la bulle.',ttl:'Assistante Abidjan',ph:'Écrivez votre message…',hi:n=>'Bonjour ! Je suis l’assistante de '+n+'. Comment puis-je vous aider ?',chips:['Prendre rendez-vous','Tarifs','Horaires','Urgence dentaire'],price:'Le prix dépend du soin (détartrage 25.000F, blanchiment 45.000F, consultation 15.000F). Le dentiste fait un devis précis après consultation. Voulez-vous réserver ?',hours:'Ouvert Lundi-Samedi 8h-18h. Je peux transmettre votre demande : quel moment vous arrange ?',where:'Nous sommes à Cocody Rue des Jardins, Abidjan. Lien Google Maps sur demande.',urgent:'Je suis désolé que vous souffriez. Pour douleur forte/gonflement/saignement, donnez votre prénom et on vous rappelle en priorité.',askName:'Parfait. Quel est votre prénom ?',askPhone:n=>'Merci '+n+'. Votre numéro WhatsApp avec indicatif (ex: +225 07...)?',badPhone:'Numéro incomplet. Exemple : +225 07 05 83 48 50',askTime:'Quand préférez-vous être appelé(e) ?',timeChips:['Aujourd’hui','Demain','Cette semaine'],done:(n,t,c)=>'Merci '+n+', demande enregistrée ('+t+'). '+c+' vous contactera.',cardT:'Démo : ce que la clinique reçoit',f:['Patient','Téléphone','Souhait','Motif','Reçu le'],reasonB:'Rendez-vous',reasonU:'Urgence',wa:'Continuer sur WhatsApp',thanks:'Avec plaisir ! Autre chose ?',cancel:'D’accord, j’annule.',fb:'Je n’ai pas compris. Choisissez ci-dessous :'},
en:{brand:'🦷 ',h1:n=>n+' AI Assistant',sub:'Demo: answers patients 24/7. Click bubble.',ttl:'Assistant',ph:'Type your message…',hi:n=>'Hello! I’m assistant for '+n+'. How can I help?',chips:['Book appointment','Prices','Hours','Emergency'],price:'Price depends on treatment. Dentist gives quote after first visit. Book?',hours:'Opening hours here. When suits you?',where:'Address + Google Maps link here.',urgent:'Sorry you’re in pain. Leave name, clinic calls back priority.',askName:'What’s your first name?',askPhone:n=>'Thanks '+n+'. Phone with country code?',badPhone:'Number looks incomplete. Eg +1 415 555 0132.',askTime:'When to call you?',timeChips:['Today','Tomorrow','This week'],done:(n,t,c)=>'Thanks '+n+', request recorded ('+t+'). '+c+' will contact you.',cardT:'Demo: what clinic receives',f:['Patient','Phone','Preferred','Reason','Received'],reasonB:'Appointment',reasonU:'Emergency',wa:'Continue on WhatsApp',thanks:'Welcome! Anything else?',cancel:'Cancelled.',fb:'Did not get that. Pick below:'}
};
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
const R={cancel:/\b(annul|cancel|stop|laisse tomber|never ?mind)\b/,urgent:/\b(urgen|douleur|mal aux dents|rage de dent|abces|gonfl|saign|pain|emergency|swell|bleed|cass|broken|ache)\b/,book:/\b(rdv|rendez|reserv|prendre|book|appointment|schedul|consult)\b/,price:/\b(prix|tarif|cout|combien|devis|price|cost|how much|fee|quote|blanchiment|detartrage)\b/,hours:/\b(horaire|heure|ouvert|ferme|hours|open|clos)\b/,where:/\b(adresse|ou etes|ou se trouve|localis|situe|address|where|location|map)\b/,human:/\b(humain|parler|appeler|call me|human|person|agent)\b/,thanks:/\b(merci|thank|super|parfait|genial|great|perfect)\b/,hi:/\b(bonjour|bonsoir|salut|coucou|hello|hi|hey)\b/};
const $=id=>document.getElementById(id),log=$('log');let st={step:null,name:'',phone:'',urgent:false};
const L=()=>T[lang],name=C.clinic+(C.city?' - '+C.city:'');
function ui(){document.documentElement.lang=lang;$('brand').textContent='🦷 '+name;$('h1').textContent=L().h1(name);$('sub').textContent=L().sub;$('ttl').textContent=L().ttl;$('in').placeholder=L().ph;document.title=name}
function add(t,cls){const d=document.createElement('div');d.className='m '+cls;d.textContent=t;log.appendChild(d);log.scrollTop=9999;return d}
function chips(a){const d=document.createElement('div');d.className='chips';a.forEach(x=>{const b=document.createElement('button');b.type='button';b.textContent=x;b.onclick=()=>handle(x);d.appendChild(b)});log.appendChild(d);log.scrollTop=9999}
function bot(t,c,after){setTimeout(()=>{add(t,'b');if(c)chips(c);if(after)after()},400)}
function handle(raw){const t=raw.trim();if(!t)return;add(t,'u');let n=norm(t);if(R.cancel.test(n)){st={step:null,name:'',phone:'',urgent:false};bot(L().cancel, L().chips);return}
if(st.step==='name'){st.name=t;st.step='phone';bot(L().askPhone(st.name));return}
if(st.step==='phone'){if(t.replace(/\D/g,'').length<8){bot(L().badPhone);return}st.phone=t;st.step='time';bot(L().askTime, L().timeChips);return}
if(st.step==='time'){const time=t;const l=L(),now=new Date().toLocaleString(lang),reason=st.urgent?l.reasonU:l.reasonB;const v=[st.name||'Patient',st.phone,time,reason,now];add(l.cardT+'\n'+l.f.map((k,i)=>k+' : '+v[i]).join('\n'),'card');if(C.wa){const a=document.createElement('a');a.className='wa';a.textContent=l.wa;a.target='_blank';a.href='https://wa.me/'+C.wa+'?text='+encodeURIComponent(C.clinic+' - '+reason+' - '+st.name+' - '+time);log.appendChild(a);}bot(l.done(st.name||'Patient',time,C.clinic), L().chips);st={step:null,name:'',phone:'',urgent:false};return}
if(R.urgent.test(n)){st.urgent=true;st.step='name';bot(L().urgent+' '+L().askName);return}
if(R.book.test(n)){st.urgent=false;st.step='name';bot(L().askName);return}
if(R.price.test(n)){bot(L().price, L().chips);return}
if(R.hours.test(n)){bot(L().hours, L().timeChips);return}
if(R.where.test(n)){bot(L().where, L().chips);return}
if(R.thanks.test(n)||R.hi.test(n)){bot(L().hi(C.clinic), L().chips);return}
bot(L().fb, L().chips);
}
$('f').onsubmit=e=>{e.preventDefault();const v=$('in').value;$('in').value='';handle(v)};
$('fab').onclick=()=>{$('box').classList.toggle('on');if(!log.children.length)bot(L().hi(C.clinic), L().chips)};$('x').onclick=()=>$('box').classList.remove('on');ui();
</script></body></html>
