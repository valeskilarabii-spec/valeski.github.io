<script>
const msgs = document.getElementById('messages');
const input = document.getElementById('input');

let step = 0;
let data = {};
let finished = false;

function add(text, who) {
  const d = document.createElement('div');
  d.className = 'msg ' + who;
  d.textContent = text;
  msgs.appendChild(d);
  msgs.scrollTop = msgs.scrollHeight;
}

function normalize(text) {
  return text.trim().toLowerCase();
}

function send() {
  const v = input.value.trim();

  if (!v || finished) return;

  add(v, 'user');
  input.value = '';

  setTimeout(() => {
    processMessage(v);
  }, 400);
}

function processMessage(v) {
  const answer = normalize(v);

  switch (step) {

    case 0:
      if (
        !answer.includes('acheter') &&
        !answer.includes('achat') &&
        !answer.includes('louer') &&
        !answer.includes('location')
      ) {
        add(
          "Souhaitez-vous acheter ou louer un logement ?",
          'bot'
        );
        return;
      }

      data.projet =
        answer.includes('louer') ||
        answer.includes('location')
          ? 'Location'
          : 'Achat';

      add(
        "Très bien ! Quel est votre budget approximatif en euros ?",
        'bot'
      );

      step = 1;
      break;

    case 1:
      data.budget = v;

      add(
        "Merci ! Dans quel quartier ou quelle ville recherchez-vous un bien ?",
        'bot'
      );

      step = 2;
      break;

    case 2:
      data.secteur = v;

      if (data.projet === 'Achat') {
        add(
          "Où en êtes-vous dans votre financement ? " +
          "Répondez : financement obtenu, en cours ou pas encore commencé.",
          'bot'
        );
        step = 3;
      } else {
        add(
          "Quel est votre délai souhaité pour emménager ?",
          'bot'
        );
        step = 4;
      }
      break;

    case 3:
      if (
        answer.includes('obtenu') ||
        answer.includes('accord') ||
        answer.includes('validé')
      ) {
        data.financement = 'Financement obtenu';
      } else if (
        answer.includes('cours') ||
        answer.includes('demande') ||
        answer.includes('attente')
      ) {
        data.financement = 'Financement en cours';
      } else if (
        answer.includes('commencé') ||
        answer.includes('commence') ||
        answer.includes('pas encore')
      ) {
        data.financement = 'Financement non commencé';
      } else {
        add(
          "Je n'ai pas compris. Indiquez si votre financement est obtenu, en cours ou pas encore commencé.",
          'bot'
        );
        return;
      }

      add(
        "Quel est votre nom et prénom ?",
        'bot'
      );

      step = 5;
      break;

    case 4:
      data.emmenagement = v;

      add(
        "Quel est votre nom et prénom ?",
        'bot'
      );

      step = 5;
      break;

    case 5:
      if (v.length < 2) {
        add(
          "Merci de saisir un nom valide.",
          'bot'
        );
        return;
      }

      data.nom = v;

      add(
        "Quel est votre numéro de téléphone avec l'indicatif international ? " +
        "Exemple : +33 6 12 34 56 78.",
        'bot'
      );

      step = 6;
      break;

    case 6: {
      const phone = v.replace(/[\s().-]/g, '');

      if (!/^\+[1-9]\d{7,14}$/.test(phone)) {
        add(
          "Le numéro semble incorrect. Indiquez l'indicatif du pays " +
          "et le numéro, par exemple +33 6 12 34 56 78.",
          'bot'
        );
        return;
      }

      data.telephone = v;

      add(
        "Merci " + data.nom + " ! Votre demande est prête.\n" +
        "Projet : " + data.projet + "\n" +
        "Budget : " + data.budget + "\n" +
        "Secteur : " + data.secteur + "\n" +
        (
          data.financement
            ? "Financement : " + data.financement + "\n"
            : "Emménagement : " + data.emmenagement + "\n"
        ) +
        "Nous pouvons maintenant rechercher un créneau de visite. " +
        "Souhaitez-vous une visite le matin ou l'après-midi ?",
        'bot'
      );

      step = 7;
      break;
    }

    case 7:
      data.preferenceVisite = v;

      add(
        "Merci ! Votre préférence a été enregistrée dans cette conversation. " +
        "Attention : aucune visite n'est encore réservée. " +
        "L'agence devra vérifier ses disponibilités et vous confirmer le rendez-vous.",
        'bot'
      );

      finished = true;
      break;
  }
}

input.addEventListener('keydown', e => {
  if (e.key === 'Enter') send();
});
</script>
