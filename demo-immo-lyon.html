<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Horizon — Assistant immobilier</title>
<style>
:root{--navy:#0f172a;--blue:#1d4ed8;--ink:#172033;--muted:#64748b;--bg:#f1f5f9;--line:#e2e8f0}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{background:linear-gradient(130deg,#0b1224,#1e40af);color:white;padding:22px;display:flex;justify-content:space-between;align-items:center}
main{max-width:1120px;margin:34px auto;padding:0 18px;display:grid;grid-template-columns:1fr 420px;gap:28px}
.chat{background:#fff;border-radius:20px;box-shadow:0 20px 55px #0f172a20;border:1px solid var(--line);overflow:hidden;display:flex;flex-direction:column;height:760px}
#messages{padding:16px;display:flex;flex-direction:column;gap:10px;overflow-y:auto;flex:1;background:#f8fafc}
.msg{max-width:88%;padding:11px 14px;border-radius:16px;font-size:14px;line-height:1.5;white-space:pre-wrap}
.bot{align-self:flex-start;background:white;border:1px solid var(--line)} .user{align-self:flex-end;background:var(--blue);color:white}
.quick{display:flex;gap:8px;flex-wrap:wrap}.quick button{border:1px solid #bfdbfe;background:#eff6ff;color:#1d4ed8;border-radius:999px;padding:8px 11px;cursor:pointer}
.composer{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}.composer input{flex:1;border:1px solid #cbd5e1;border-radius:999px;padding:12px 15px}.composer button{border:0;border-radius:999px;background:var(--blue);color:white;padding:0 18px;font-weight:700;cursor:pointer}
@media(max-width:800px){main{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div>AGENCE HORIZON <small>Lyon 6 · Assistant immobilier</small></div></header>
<main>
<section><h1>Trouvez le bien qui correspond à votre projet.</h1></section>
<section class="chat">
<div id="messages"><div class="msg bot">Bonjour 👋 Vous souhaitez acheter, louer, ou voir les biens ?</div></div>
<form class="composer" id="chatForm"><input id="input" placeholder="Écrivez..."><button type="submit">Envoyer</button></form>
</section>
</main>
<script>
(() => {
  const messages = document.getElementById('messages');
  const input = document.getElementById('input');
  const form = document.getElementById('chatForm');
  const state = {step:'project', project:'', budget:'', area:'', finished:false};
  const listings = [
    {title:'T2 lumineux — Lyon 6e',area:'Lyon 6',price:245000,mode:'achat',detail:'2 pièces · 46 m² · annonce fictive'},
    {title:'T3 proche commerces — Lyon 3e',area:'Lyon 3',price:325000,mode:'achat',detail:'3 pièces · 68 m²'},
    {title:'Studio meublé — Lyon 6e',area:'Lyon 6',price:780,mode:'location',detail:'Studio · 25 m² · 780 €/mois'},
    {title:'T2 à Villeurbanne',area:'Villeurbanne',price:920,mode:'location',detail:'2 pièces · 43 m² · 920 €/mois'}
  ];
  function add(t,w){const n=document.createElement('div');n.className='msg '+w;n.textContent=t;messages.appendChild(n);messages.scrollTop=messages.scrollHeight;}
  function quick(o){const w=document.createElement('div');w.className='quick';o.forEach(l=>{const b=document.createElement('button');b.type='button';b.textContent=l;b.addEventListener('click',()=>{input.value=l;submitMessage();});w.appendChild(b);});messages.appendChild(w);}
  function moneyNumber(value){
    const text=String(value||'').toLowerCase().trim();
    const compact=text.replace(/\s/g,'').replace(/€/g,'').replace(/,/g,'.');
    const match=compact.match(/\d+(?:\.\d+)?/); if(!match) return null;
    let amount=Number(match[0]);
    if(/million|millions|\bm\b/.test(text)) amount*=1000000;
    else if(/\bk\b|000|mille/.test(text)) amount*=1000;
    return Number.isFinite(amount)?amount:null;
  }
  function showListings(){
    const max=moneyNumber(state.budget);
    const mode=state.project==='location'?'location':'achat';
    const normalize=v=>String(v||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,'').trim();
    const area=normalize(state.area);
    let found=listings.filter(x=>x.mode===mode);
    if(max!==null&&Number.isFinite(max)) found=found.filter(x=>Number(x.price)<=max);
    if(area&&!['peuimporte','toutelaville','aucun'].includes(area)){
      found=found.filter(x=>normalize(x.area).includes(area));
    }
    if(!found.length){
      const alternatives=listings.filter(x=>{
        if(x.mode!==mode) return false;
        if(max!==null&&Number.isFinite(max)&&Number(x.price)>max) return false;
        return true;
      });
      if(alternatives.length){
        add(`Je n’ai pas trouvé pour ${state.area} avec ${state.budget}. Voici d’autres exemples :\n\n`+alternatives.map((x,i)=>`${i+1}. ${x.title} - ${x.detail}`).join('\n\n'),'bot');
      } else {
        add(`Aucun exemple pour ${mode} avec ce budget. Augmente ton budget.`,'bot');
      }
      state.step='next'; quick(['Affiner ma recherche','Préparer une demande','Terminer']); return;
    }
    add("Voici des exemples fictifs :\n\n"+found.map((x,i)=>`${i+1}. ${x.title}\n${x.detail}\nPrix : ${x.price} €`).join('\n\n'),'bot');
    state.step='next'; quick(['Affiner ma recherche','Préparer une demande','Terminer']);
  }
  function process(raw){
    const text=raw.trim(), low=text.toLowerCase();
    if(state.step==='project'){
      if(/louer|location/.test(low)) state.project='location'; else if(/acheter|achat/.test(low)) state.project='achat'; else {add("Acheter ou louer ?",'bot');return;}
      state.step='budget'; add(state.project==='location'?"Loyer max ?":"Budget max ?",'bot'); return;
    }
    if(state.step==='budget'){ state.budget=text; state.step='area'; add("Secteur ? ex: Lyon 6, Lyon 3, Villeurbanne",'bot'); return; }
    if(state.step==='area'){ state.area=text; showListings(); return; }
    if(state.step==='next'){
      if(/affiner/i.test(low)){state.step='budget';add("Nouveau budget ?",'bot');return;}
      add("Merci d’avoir testé Horizon Bot.",'bot'); state.finished=true; return;
    }
  }
  function submitMessage(){const v=input.value.trim(); if(!v||state.finished)return; add(v,'user'); input.value=''; process(v);}
  form.addEventListener('submit',e=>{e.preventDefault();submitMessage();});
})();
</script>
</body>
</html>
