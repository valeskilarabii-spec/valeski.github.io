<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clinique IA Universelle</title><style>*{box-sizing:border-box;margin:0}body{font-family:system-ui;color:#10303c;background:#f4f9fb}header{background:#fff;padding:16px 24px;font-weight:700;color:#0a7ea4;border-bottom:1px solid #dbe9ef}.hero{background:#0a7ea4;color:#fff;text-align:center;padding:72px 20px}.hero h1{font-size:clamp(26px,5vw,44px);max-width:18ch;margin:0 auto 14px}.hero p{max-width:52ch;margin:0 auto;opacity:.92}#fab{position:fixed;right:20px;bottom:20px;width:62px;height:62px;border-radius:50%;border:0;background:#0a7ea4;color:#fff;font-size:26px;cursor:pointer;z-index:999;box-shadow:0 4px 14px #0003}#box{position:fixed;right:20px;bottom:96px;width:min(380px,calc(100vw - 40px));height:min(560px,calc(100vh - 120px));background:#fff;border-radius:14px;box-shadow:0 8px 30px #0003;display:none;flex-direction:column;overflow:hidden;z-index:999}#box.on{display:flex}#top{background:#0a7ea4;color:#fff;padding:14px 16px;display:flex;justify-content:space-between;font-weight:600}#top button{background:none;border:0;color:#fff;font-size:20px;cursor:pointer}#log{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:8px;background:#f4f9fb}.m{max-width:85%;padding:10px 12px;border-radius:12px;font-size:14.5px;line-height:1.4;white-space:pre-line}.b{background:#fff;border:1px solid #dbe9ef;align-self:flex-start}.u{background:#0a7ea4;color:#fff;align-self:flex-end}.card{background:#fff8e6;border:1px dashed #d9a400;font-size:13px}.chips{display:flex;flex-wrap:wrap;gap:6px}.chips button{border:1px solid #0a7ea4;background:#fff;color:#0a7ea4;border-radius:16px;padding:6px 12px;font-size:13.5px;cursor:pointer}.wa{display:inline-block;background:#1faa59;color:#fff;text-decoration:none;border-radius:16px;padding:7px 14px;font-size:14px}form{display:flex;gap:8px;padding:10px;border-top:1px solid #dbe9ef}input{flex:1;border:1px solid #c5d8e0;border-radius:20px;padding:10px 14px;font-size:15px}form button{border:0;background:#0a7ea4;color:#fff;border-radius:20px;padding:0 16px;cursor:pointer}</style></head><body><header id="brand">🦷 Clinique Sourire+ Abidjan</header><section class="hero"><h1 id="h1">Assistant IA qui comprend TOUT</h1><p id="sub">Démo 24h/24 - Testez bonsoir, prix, adresse, urgence, même avec fautes</p></section><button id="fab">💬</button><div id="box"><div id="top"><span id="ttl">Assistante Abidjan</span><button id="x">✕</button></div><div id="log"></div><form id="f"><input id="in" placeholder="Posez n'importe quelle question..."><button>➤</button></form></div><script>
const C={clinic:'Sourire+ Cocody',city:'Abidjan',wa:'2250705834850'};
const T={fr:{hi:n=>'Bonjour ! Assistante de '+n+' 👋 Je comprends TOUT : bonsoir docteur, c combien, vous etes ou, jai mal... Posez votre question !',chips:['Prendre RDV','Tarifs','Adresse','Urgence'],price:'💰 Consultation 15.000F, Détartrage 25.000F, Blanchiment 45.000F. Devis précis après 1ère consult. Réserver ?',hours:'🕘 Lun-Sam 8h-18h. Quel créneau ?',where:'📍 Cocody Rue des Jardins, Abidjan. Lien Maps sur demande.',urgent:'🚨 Désolé pour la douleur. Votre prénom svp ? On vous rappelle en priorité.',askName:'Votre prénom ?',askPhone:n=>'Merci '+n+'. Numéro WhatsApp ?',badPhone:'Numéro court. Ex: +225 07 05 83 48 50',askTime:'Quand vous appeler ?',timeChips:['Aujourd’hui','Demain','Matin','14h30'],done:(n,t,c)=>'✅ Merci '+n+', RDV '+t+' enregistré. '+c+' confirme par WhatsApp.',cardT:'Fiche patient reçue',f:['Nom','Tel','Heure','Motif','Date'],reasonB:'RDV',reasonU:'Urgence',wa:'WhatsApp',fb:'Choisissez ci-dessous :'}};
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');const R={urgent:/\b(urgen|douleur|mal|rage|abces|gonfl|saign|pain|emergency)\b/,book:/\b(rdv|rendez|reserv|prendre|book|appointment|dispo|creneau)\b/,price:/\b(prix|tarif|cout|combien|devis|blanchiment|detartrage|facette)\b/,hours:/\b(horaire|heure|ouvert|ferme|hours)\b/,where:/\b(adresse|ou etes|situe|address|where|location)\b/,hi:/\b(bonjour|bonsoir|salut|cc|hello|hi|hey|bonsoir docteur)\b/};
const $=id=>document.getElementById(id),log=$('log');let st={step:null,name:'',phone:'',urgent:false};const L=()=>T.fr,name=C.clinic+' - '+C.city;
function add(t,cls){const d=document.createElement('div');d.className='m '+cls;d.textContent=t;log.appendChild(d);log.scrollTop=9999;return d}
function chips(a){const d=document.createElement('div');d.className='chips';a.forEach(x=>{const b=document.createElement('button');b.type='button';b.textContent=x;b.onclick=()=>handle(x);d.appendChild(b)});log.appendChild(d);log.scrollTop=9999}
function bot(t,c){setTimeout(()=>{add(t,'b');if(c)chips(c)},350)}
function handle(raw){const t=raw.trim();if(!t)return;add(t,'u');let n=norm(t);if(st.step==='name'){st.name=t;st.step='phone';bot(L().askPhone(st.name));return}if(st.step==='phone'){if(t.replace(/\D/g,'').length<8){bot(L().badPhone);return}st.phone=t;st.step='time';bot(L().askTime, L().timeChips);return}if(st.step==='time'){const l=L(),now=new Date().toLocaleString(),reason=st.urgent?l.reasonU:l.reasonB;const v=[st.name||'Patient',st.phone,t,reason,now];add(l.cardT+'\n'+l.f.map((k,i)=>k+' : '+v[i]).join('\n'),'card');if(C.wa){const a=document.createElement('a');a.className='wa';a.textContent=l.wa;a.target='_blank';a.href='https://wa.me/'+C.wa+'?text='+encodeURIComponent(C.clinic+' - '+reason+' - '+st.name+' - '+t);log.appendChild(a);}bot(l.done(st.name||'Patient',t,C.clinic), L().chips);st={step:null,name:'',phone:'',urgent:false};return}if(R.urgent.test(n)){st.urgent=true;st.step='name';bot(L().urgent+' '+L().askName);return}if(R.book.test(n)){st.urgent=false;st.step='name';bot(L().askName);return}if(R.price.test(n)){bot(L().price, L().chips);return}if(R.hours.test(n)){bot(L().hours, L().timeChips);return}if(R.where.test(n)){bot(L().where, L().chips);return}if(R.hi.test(n)){bot(L().hi(C.clinic), L().chips);return}if(n.match(/\d+h/)||n.includes('matin')||n.includes('demain')){st.step='name';bot(L().askName);return}bot(L().fb, L().chips);}
$('f').onsubmit=e=>{e.preventDefault();const v=$('in').value;$('in').value='';handle(v)};$('fab').onclick=()=>{$('box').classList.toggle('on');if(!log.children.length)bot(L().hi(C.clinic), L().chips)};$('x').onclick=()=>$('box').classList.remove('on');
</script></body></html>
